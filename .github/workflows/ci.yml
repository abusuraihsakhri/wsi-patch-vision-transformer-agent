name: WSI Workflow Screening CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,test]"
      - name: Compile Python source
        run: python -m compileall -q agents patho_vit_agent cli.py enrichment.py simulator.py
      - name: Verify installed console command
        run: wsi-patch-vision-transformer-agent --help
      - name: Python regression tests
        run: python -m pytest -v
      - name: Set up Node.js for browser tests
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser syntax and evaluation tests
        if: matrix.python-version == '3.12'
        run: |
          node --check web/app.mjs
          node --test tests/test_web.mjs
