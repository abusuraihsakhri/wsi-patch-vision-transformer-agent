[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wsi-patch-vision-transformer-agent"
version = "2.0.0"
description = "Deterministic WSI workflow screening and audit CLI"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=7,<10", "httpx>=0.24,<1"]

[project.scripts]
wsi-patch-vision-transformer-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/wsi-patch-vision-transformer-agent"
Repository = "https://github.com/abusuraihsakhri/wsi-patch-vision-transformer-agent.git"

[tool.setuptools]
packages = ["agents", "patho_vit_agent"]
py-modules = ["cli", "enrichment", "simulator", "patho_vit_agent_app"]
